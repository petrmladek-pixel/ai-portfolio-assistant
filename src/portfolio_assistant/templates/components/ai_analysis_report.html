<section class="rounded-sm border border-border bg-card">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-border px-6 py-5">
    <div>
      <p class="text-[11px] font-semibold uppercase tracking-wider text-gain">AI report</p>
      <h3 class="mt-1 text-lg font-bold tracking-tight text-foreground">Strategický audit portfolia</h3>
    </div>
    <div class="flex items-center gap-3">
      <span x-cloak x-show="analysisCached" class="rounded-sm bg-secondary px-2.5 py-1 text-xs font-medium text-gain">
        Načteno z cache
      </span>
      <button
        type="button"
        @click="copyReport()"
        :disabled="!analysisResult"
        class="rounded-sm border border-border px-3 py-2 text-xs font-medium text-foreground disabled:cursor-not-allowed disabled:opacity-50"
      >
        <span x-text="copied ? 'Zkopírováno' : 'Kopírovat report'"></span>
      </button>
    </div>
  </div>
  <div class="min-h-[24rem] overflow-x-auto px-6 py-7 sm:px-10">
    <div class="analysis-markdown max-w-none text-sm leading-7 text-foreground" x-html="htmlContent"></div>
  </div>
</section>
