<section class="flex flex-col rounded-sm border border-border bg-card"
  x-data='portfolioChat({{ selected_portfolio_id | tojson }})'>
  <div class="flex items-center gap-2 border-b border-border px-6 py-4">
    <span class="size-1.5 rounded-full bg-gain" aria-hidden="true"></span>
    <h3 class="text-[11px] font-semibold uppercase tracking-wider text-foreground">
      AI Portfolio Copilot
    </h3>
  </div>

  <div id="chat-log" x-ref="chatContainer"
    class="flex max-h-96 min-h-64 flex-col gap-4 overflow-y-auto px-6 py-5">
    <template x-for="(msg, index) in messages" :key="index">
      <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
        <div :class="msg.role === 'user'
          ? 'max-w-[80%] rounded-sm bg-secondary px-4 py-3 text-sm text-foreground'
          : 'max-w-[85%] rounded-sm border border-border bg-card px-4 py-4 text-sm leading-relaxed text-foreground'"
          x-html="msg.htmlContent"></div>
      </div>
    </template>

    <div x-cloak x-show="isLoading" class="flex justify-start">
      <div class="max-w-[85%] rounded-sm border border-border bg-card px-4 py-4 text-sm text-muted-foreground">
        <div class="flex items-center gap-2">
          <span class="size-2 animate-bounce rounded-full bg-muted-foreground [animation-delay:-0.3s]"></span>
          <span class="size-2 animate-bounce rounded-full bg-muted-foreground [animation-delay:-0.15s]"></span>
          <span class="size-2 animate-bounce rounded-full bg-muted-foreground"></span>
          <span class="text-xs italic ml-1">Copilot is analyzing...</span>
        </div>
      </div>
    </div>
  </div>

  <form @submit.prevent="sendMessage" class="flex items-center gap-2 border-t border-border p-3">
    <input type="text" x-model="userInput" :disabled="isLoading"
      placeholder="Ask the AI copilot..." aria-label="Message for AI copilot"
      class="flex-1 rounded-sm border border-border bg-card px-3 py-2.5 text-sm text-foreground outline-none transition-colors placeholder:text-muted-foreground focus:border-foreground disabled:opacity-50" />
    <button type="submit" :disabled="isLoading || !userInput.trim()" aria-label="Send message"
      class="flex size-10 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground transition-all hover:opacity-90 active:scale-95 disabled:opacity-50">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
    </button>
  </form>
</section>

<script>
  function portfolioChat(portfolioId) {
    return {
      portfolioId: portfolioId,
      messages: [],
      userInput: '',
      isLoading: false,

      async init() {
        if (!this.portfolioId || this.portfolioId === 'all') {
          this.messages = [{ role: 'model', htmlContent: DOMPurify.sanitize(marked.parse('Select a portfolio.')) }];
          return;
        }
        try {
          const res = await fetch(`/api/portfolios/${this.portfolioId}/chat/history`, {
            headers: { Accept: 'application/json' }
          });
          if (!res.ok) throw new Error('Failed');
          const history = await res.json();
          if (Array.isArray(history) && history.length > 0) {
            this.messages = history.map(m => ({
              role: m.role,
              htmlContent: DOMPurify.sanitize(marked.parse(m.content))
            }));
          } else {
            this.setWelcome();
          }
        } catch {
          this.setWelcome();
        }
        await this.$nextTick();
        if (this.$refs.chatContainer) {
          this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight;
        }
      },

      setWelcome() {
        const text = 'Welcome! I am your AI Portfolio Copilot. Ask me about your allocation or risk.';
        this.messages = [{ role: 'model', htmlContent: DOMPurify.sanitize(marked.parse(text)) }];
      },

      async sendMessage() {
        const text = this.userInput.trim();
        if (!text || this.isLoading) return;
        if (!this.portfolioId || this.portfolioId === 'all') return;

        this.messages.push({ role: 'user', htmlContent: DOMPurify.sanitize(marked.parse(text)) });
        this.userInput = '';
        this.isLoading = true;

        await this.$nextTick();
        if (this.$refs.chatContainer) {
          this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight;
        }

        try {
          const res = await fetch(`/api/portfolios/${this.portfolioId}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ message: text })
          });
          if (!res.ok) throw new Error('Chat failed');
          const data = await res.json();
          this.messages.push({
            role: 'model',
            htmlContent: DOMPurify.sanitize(marked.parse(data.message || 'No response.'))
          });
        } catch (err) {
          this.messages.push({
            role: 'model',
            htmlContent: DOMPurify.sanitize(marked.parse(`**Error:** ${err.message}`))
          });
        } finally {
          this.isLoading = false;
          await this.$nextTick();
          if (this.$refs.chatContainer) {
            this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight;
          }
        }
      }
    };
  }
</script>
