<!DOCTYPE html>
<html lang="cs" class="light bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI Portfolio Assistant{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart rendering -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: 'rgb(var(--background) / <alpha-value>)',
              foreground: 'rgb(var(--foreground) / <alpha-value>)',
              card: 'rgb(var(--card) / <alpha-value>)',
              'card-foreground': 'rgb(var(--card-foreground) / <alpha-value>)',
              primary: 'rgb(var(--primary) / <alpha-value>)',
              'primary-foreground': 'rgb(var(--primary-foreground) / <alpha-value>)',
              secondary: 'rgb(var(--secondary) / <alpha-value>)',
              'secondary-foreground': 'rgb(var(--secondary-foreground) / <alpha-value>)',
              muted: 'rgb(var(--muted) / <alpha-value>)',
              'muted-foreground': 'rgb(var(--muted-foreground) / <alpha-value>)',
              border: 'rgb(var(--border) / <alpha-value>)',
              gain: 'rgb(var(--gain) / <alpha-value>)',
              sidebar: 'rgb(var(--sidebar) / <alpha-value>)',
            },
            borderRadius: { sm: 'var(--radius)' },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
          },
        },
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --background: 250 250 250;
        --foreground: 36 36 36;
        --card: 255 255 255;
        --card-foreground: 36 36 36;
        --primary: 52 52 52;
        --primary-foreground: 255 255 255;
        --secondary: 247 247 247;
        --secondary-foreground: 52 52 52;
        --muted: 247 247 247;
        --muted-foreground: 138 138 138;
        --border: 229 229 229;
        --gain: 47 145 96;
        --sidebar: 250 250 250;
        --radius: 0.125rem;
      }
      body { background-color: rgb(var(--background)); color: rgb(var(--foreground)); }
      * { border-color: rgb(var(--border)); }
      .font-mono { font-variant-numeric: tabular-nums; }
      [x-cloak] { display: none !important; }
      .text-label {
        display: block;
        color: rgb(var(--muted-foreground));
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-bottom: 0.375rem;
        text-transform: uppercase;
      }
      .input-control {
        background: rgb(var(--card));
        border: 1px solid rgb(var(--border));
        border-radius: var(--radius);
        color: rgb(var(--foreground));
        display: block;
        font-size: 0.875rem;
        outline: none;
        padding: 0.625rem 0.75rem;
        width: 100%;
      }
      .input-control:focus { border-color: rgb(var(--foreground)); }
      .analysis-markdown h1, .analysis-markdown h2, .analysis-markdown h3 {
        font-weight: 700;
        letter-spacing: -0.025em;
        margin: 1.75rem 0 0.75rem;
      }
      .analysis-markdown h1 { font-size: 1.5rem; }
      .analysis-markdown h2 { border-bottom: 1px solid rgb(var(--border)); font-size: 1.25rem; padding-bottom: 0.5rem; }
      .analysis-markdown h3 { font-size: 1rem; }
      .analysis-markdown p, .analysis-markdown ul, .analysis-markdown ol { margin: 0.75rem 0; }
      .analysis-markdown ul, .analysis-markdown ol { padding-left: 1.25rem; }
      .analysis-markdown ul { list-style: disc; }
      .analysis-markdown ol { list-style: decimal; }
      .analysis-markdown li + li { margin-top: 0.35rem; }
      .analysis-markdown blockquote { border-left: 3px solid rgb(var(--gain)); color: rgb(var(--muted-foreground)); margin: 1rem 0; padding-left: 1rem; }
      .analysis-markdown table { border-collapse: collapse; margin: 1.25rem 0; width: 100%; }
      .analysis-markdown th, .analysis-markdown td { border: 1px solid rgb(var(--border)); padding: 0.75rem; text-align: left; vertical-align: top; }
      .analysis-markdown th { background: rgb(var(--secondary)); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }
      .analysis-markdown code { background: rgb(var(--secondary)); font-family: "JetBrains Mono", monospace; font-size: 0.875em; padding: 0.125rem 0.25rem; }
    </style>
  </head>
  <body class="min-h-screen bg-background text-foreground">
    {% block body %}{% endblock %}
  </body>
</html>
