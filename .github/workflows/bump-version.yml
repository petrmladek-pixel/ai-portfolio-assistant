name: Bump Version and Tag

on:
  push:
    branches:
      - main
    # Ignore commits created by the action bot to avoid infinite loops
    paths-ignore:
      - 'pyproject.toml'
      - 'CHANGELOG.md'

jobs:
  bump:
    runs-on: ubuntu-latest
    # Explicitly safeguard against running on automated bump commits or bot activity
    if: "github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')"

    # Required to push commits and tags back to the repository
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # 2. Použije tento token pro checkout kódu
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # --- BEZPEČNÉ STAŽENÍ TAGŮ (bez parametru --force) ---
      - name: Fetch all git tags
        run: git fetch --tags

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

      - name: Install dependencies (including Commitizen)
        run: uv sync --all-extras --dev

      - name: Run Commitizen Bump
        run: |
          # cz --no-raise 3,21 bump handles cases where no commits require a version increment cleanly
          uv run cz --no-raise 3,21 bump --yes

      # --- BEZPEČNÉ PUSHOVÁNÍ (pouze přes --follow-tags podle security review) ---
      - name: Push changes and tags
        run: |
          # Only push if there are actual local commits (e.g., version was bumped)
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main --follow-tags
          else
            echo "No version changes detected. Skipping push."
          fi
