# .pre-commit-config.yaml
repos:
  # 1. Standard file-endings, whitespace, and syntax checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals

  # 2. Ruff for lightning-fast Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # 3. Local Mypy (runs inside your local uv virtual environment)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: true

  # 4. Codespell for catching typos before pushing to GitHub
  # Ignored Czech and Dutch broker-specific header terms are listed in the arguments below
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--ignore-words-list, "mnozstvi,cas,bpe,bep,prumerny,kurz,cena,produkt,aantal,koers,waarde,wisselkoers,transactiekosten,totaal"]
        types_or: [python, markdown, yaml]
