[project]
name = "portfolio_assistant"
version = "0.5.0"
description = "A simple portfolio assistant built with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.110.0",
    "google-genai>=2.14.0",
    "jinja2>=3.1.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.28.0",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "commitizen>=4.17.0",
    "google-genai>=2.14.0",
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    "ignore:.*google.genai.*:DeprecationWarning"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,.venv,build,dist,uv.lock"
ignore-words-list = "mnozstvi,cas,bpe,bep,prumerny,kurz,cena,produkt,aantal,koers,waarde,wisselkoers,transactiekosten,totaal"
count = true
quiet-level = 3

[tool.uv]
package = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
strict = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*", "pandas.*", "yfinance.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "bump: version $current_version → $new_version [skip ci]"
